[portal]
base_url = "http://localhost:8080"

[tiers]
claimed = ["T1", "T2", "T3"]
# run.py has no T3 checks, so the report lists T3 as "claimed but not verified".
# T3 proof: backend/tests/test_t3_community.py (25 tests) and VOTING.md.
pitch = "Self-hosted hackathon portal (Next.js + FastAPI + SQLite): backend-enforced judge isolation, documented cross-judge normalization, quadratic community voting with anti-abuse, and lossless event import/export."

[auth]
organizer   = "Cookie: session=org_7f2a"
judge_a     = "Cookie: session=jdg_a_91bc"
judge_b     = "Cookie: session=jdg_b_44de"
participant = "Cookie: session=prt_2e88"

[routes]
gallery      = "/projects"
submit       = "/projects/new"
judge_scores = "/api/judge/scores"
peer_scores  = "/api/judge/scores?judge=judge_a"
csv_export   = "/api/export.csv"
